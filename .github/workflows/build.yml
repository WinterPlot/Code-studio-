name: Build debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: { }

env:
  BUILD_JAVA_VERSION: '17'
  BUILD_IS_RELEASE: 'false'

jobs:
  build_apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.BUILD_JAVA_VERSION }}
          distribution: 'temurin'
      - name: Gradle permissions
        run: chmod +x ./gradlew
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Fetch logback-android
        run: |
          d=composite-builds/external/logback-android
          if [ ! -d "$d/logback-core/src/main/java/ch/qos/logback/core" ]; then
            rm -rf "$d"
            git clone --depth 1 https://github.com/AndroidIDEOfficial/logback-android "$d"
          fi
          ls "$d" | head
      - name: Create fresh debug keystore
        run: |
          mkdir -p ~/.android
          rm -f ~/.android/debug.keystore
          keytool -genkeypair -v -keystore ~/.android/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
      - name: Assemble debug APK
        run: |
          ./gradlew :core:app:assembleDebug -x :core:app:validateSigningDebug --console=plain > build.log 2>&1 || {
            echo "===== WHAT WENT WRONG ====="
            grep -n -A 12 "What went wrong" build.log | cut -c1-300 | head -50
            echo "===== COMPILER ERRORS ====="
            grep -n -E "^e: |error:" build.log | cut -c1-300 | head -25
            echo "===== LAST 25 LINES ====="
            tail -n 25 build.log | cut -c1-300
            exit 1
          }
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: core/app/build/outputs/apk/debug/*.apk
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
